name: Unified TFL Client
on:
  push:
    branches: [feat/unified-client-diorama, feat/unified-visual-identity, feat/stabilize-identity, feat/audit-completion]
  pull_request:
    paths: ['vendor/**', 'tools/**', '.github/workflows/unified-client.yml']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: unified-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: vendor/trs-client/gradlew -p vendor/trs-client :common:test -PtrsVersions=26.3 --no-daemon --max-workers=2
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/scan_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-common-tests
          path: vendor/trs-client/common/build/test-results/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: '1.8.9', stack: baseline}
          - {target: '1.8.9', stack: lwjgl3}
          - {target: '1.8.9', stack: argentum}
          - {target: '26.3', stack: baseline}
          - {target: '26.3', stack: sodium}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxrandr2 libxcursor1 libxi6 libxinerama1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers libopenal1 ffmpeg
      - if: matrix.target == '1.8.9'
        run: python3 tools/ornithe/fetch_dependencies.py "$RUNNER_TEMP/ornithe-mods"
      - if: matrix.stack == 'sodium'
        run: python3 tools/verification/fetch_optimizers.py "$RUNNER_TEMP/sodium-mods"
      - name: Installed 1.8.9 client and separate probe
        if: matrix.target == '1.8.9'
        run: |
          profile=()
          if [ '${{ matrix.stack }}' = argentum ]; then profile+=(--profile); fi
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/ornithe/run_smoke.py "${profile[@]}" --production --large --unified --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          vendor/trs-client/ornithe/gradlew -p vendor/trs-client/ornithe :test --no-daemon --max-workers=2
          python3 tools/ornithe/verify_jar.py "vendor/trs-client/ornithe/build/libs/tflcore-1.8.9-$(sed -n 's/^mod_version=//p' vendor/trs-client/ornithe/gradle.properties).jar"
      - name: Installed 26.3 client, Diorama, loading and native graphics settings
        if: matrix.target == '26.3'
        run: |
          extra=()
          if [ '${{ matrix.stack }}' = sodium ]; then extra+=("-PdepthRuntimeModsDir=$RUNNER_TEMP/sodium-mods" "-PtflAuditProfile"); fi
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=unified -PdepthNativeProbe "${extra[@]}" --no-daemon --max-workers=2
          python3 tools/verification/check_unified.py vendor/trs-client/run/prod-26.3/unified-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-native-${{ matrix.target }}-${{ matrix.stack }}
          overwrite: true
          path: |
            vendor/trs-client/ornithe/build/libs/*.jar
            vendor/trs-client/ornithe/build/smoke/
            vendor/trs-client/ornithe/build/test-results/
            vendor/trs-client/ornithe/build/profiles/*-public.jfr
            vendor/trs-client/fabric/versions/26.3/build/profiles/*-public.jfr
            vendor/trs-client/fabric/versions/26.3/build/libs/*.jar
            vendor/trs-client/run/prod-26.3/unified-smoke.json
            vendor/trs-client/run/prod-26.3/screenshots/
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[unified-release]'))
    needs: [common, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: '1.8.9', stack: argentum, tag: v0.4.0-audit.4-ornithe189, title: 'TFL Client 1.8.9 — Server worlds, cardinal camera and Diorama markers'}
          - {target: '26.3', stack: sodium, tag: v0.4.0-audit.4-fabric263, title: 'TFL Client 26.3 — Server worlds, cardinal camera and Diorama markers'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unified-native-${{ matrix.target }}-${{ matrix.stack }}
          path: verified
      - run: python3 tools/verification/package_unified.py verified release-unified '${{ matrix.target }}'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_TITLE: ${{ matrix.title }}
        run: gh release create "$RELEASE_TAG" release-unified/* --prerelease --latest=false --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file docs/SERVER_MAPS.md
