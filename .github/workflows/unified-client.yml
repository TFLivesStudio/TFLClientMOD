name: Unified TFL Client
on:
  push:
    branches: [feat/unified-client-diorama, feat/unified-visual-identity, feat/stabilize-identity, feat/audit-completion, fix/server-map-sessions]
  pull_request:
    paths: ['vendor/**', 'tools/**', '.github/workflows/unified-client.yml']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
      preview_189:
        description: 'Build experimental 1.8.9 JAR only without GPU smoke certification'
        type: boolean
        default: false
      native_target:
        description: 'Limit the native matrix to one target workflow (dispatch only)'
        type: choice
        default: all
        options: [all, 1.8.9, 26.3]
      native_stack:
        description: 'Limit the native matrix to one optimizer stack workflow (dispatch only)'
        type: choice
        default: all
        options: [all, baseline, lwjgl3, argentum, sodium, iris]
      legacy_gl_driver:
        description: 'Actual software OpenGL driver for 1.8.9; changes no test assertions or fog quality'
        type: choice
        default: llvmpipe
        options: [llvmpipe, zink]
      stage_audit5_draft:
        description: 'After the complete native matrix passes, stage Audit 5 binaries and corresponding sources as a draft only'
        type: boolean
        default: false
      retain_artifacts:
        description: 'Retain Actions artifacts (disable when storage quota is exhausted; checks remain in logs)'
        type: boolean
        default: true
      native_variant:
        description: 'Experimental 1.8.9 map-render variant (dispatch only; never published)'
        type: choice
        default: standard
        options: [standard, nofog]
permissions:
  contents: read
concurrency:
  group: unified-${{ github.head_ref || github.ref_name }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.preview_189) || (github.event_name == 'push' && github.ref_name == 'fix/server-map-sessions')) && 'preview' || 'native' }}-${{ inputs.native_target || 'all' }}-${{ inputs.native_stack || 'all' }}
  cancel-in-progress: true
jobs:
  common:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.preview_189) || (github.event_name == 'push' && github.ref_name == 'fix/server-map-sessions')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: vendor/trs-client/gradlew -p vendor/trs-client :common:test -PtrsVersions=26.3 --no-daemon --max-workers=2
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/scan_secrets.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.retain_artifacts == false) && !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          name: unified-common-tests
          path: vendor/trs-client/common/build/test-results/
  native:
    # Matrix context is not readable from a job-level if (it is evaluated before strategy),
    # so per-combo dispatch filtering lives in the selector step below.
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.preview_189) || (github.event_name == 'push' && github.ref_name == 'fix/server-map-sessions')) }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mesa 25.2.8 on Ubuntu 24 hangs in vanilla RenderTarget.draw (captured native stacks).
          # Keep the complete scenario on a stable compatibility-profile software driver.
          - {target: '1.8.9', stack: baseline, os: ubuntu-22.04}
          - {target: '1.8.9', stack: lwjgl3, os: ubuntu-22.04}
          - {target: '1.8.9', stack: argentum, os: ubuntu-latest}
          - {target: '26.3', stack: baseline, os: ubuntu-latest}
          - {target: '26.3', stack: sodium, os: ubuntu-latest}
          - {target: '26.3', stack: iris, os: ubuntu-latest}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      ALSOFT_DRIVERS: 'null'
    steps:
      # Dispatch-only scenario selector. Matrix context is not readable from job-level if,
      # so a first step decides whether this combo participates. Other events always run.
      - id: selector
        if: github.event_name == 'workflow_dispatch'
        run: |
          target_match() { test "${{ inputs.native_target }}" = all || test "${{ inputs.native_target }}" = '${{ matrix.target }}'; }
          stack_match() { test "${{ inputs.native_stack }}" = all || test "${{ inputs.native_stack }}" = '${{ matrix.stack }}'; }
          if target_match && stack_match; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          # The nofog experiment is an Ornithe 1.8.9 diagnostic; any other combo stays standard.
          if [ '${{ inputs.native_variant }}' = nofog ] && [ '${{ matrix.target }}' = '1.8.9' ]; then echo variant=nofog >> "$GITHUB_OUTPUT"; else echo variant=standard >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: ${{ steps.selector.outputs.run != 'false' }}
      - uses: actions/setup-java@v4
        if: ${{ steps.selector.outputs.run != 'false' }}
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.selector.outputs.run != 'false' }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxrandr2 libxcursor1 libxi6 libxinerama1 libgl1-mesa-dri libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers libopenal1 ffmpeg
        if: ${{ steps.selector.outputs.run != 'false' && !(github.event_name == 'workflow_dispatch' && inputs.legacy_gl_driver == 'zink' && matrix.target == '1.8.9') }}
      - if: matrix.target == '1.8.9' && steps.selector.outputs.run != 'false'
        run: python3 tools/ornithe/fetch_dependencies.py "$RUNNER_TEMP/ornithe-mods"
      - if: (matrix.stack == 'sodium' || matrix.stack == 'iris') && steps.selector.outputs.run != 'false'
        run: python3 tools/verification/fetch_optimizers.py "$RUNNER_TEMP/sodium-mods" ${{ matrix.stack == 'iris' && '--iris' || '' }}
      - name: Installed 1.8.9 client and separate probe
        if: matrix.target == '1.8.9' && steps.selector.outputs.run != 'false'
        run: |
          if [ '${{ inputs.legacy_gl_driver }}' = zink ]; then
            bash tools/verification/run_legacy_mesa_ci.sh '${{ steps.selector.outputs.variant || 'standard' }}' '${{ matrix.stack }}'
            exit 0
          fi
          profile=()
          if [ '${{ matrix.stack }}' = argentum ]; then profile+=(--profile); fi
          # Dispatch-only diagnostic variant: nofog skips the map fog draw pass (the shader
          # itself may still be constructed); every standard run keeps the exact current path.
          variant=()
          if [ '${{ steps.selector.outputs.variant || 'standard' }}' = nofog ]; then variant+=(--no-fog); fi
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/ornithe/run_smoke.py "${profile[@]}" "${variant[@]}" --production --large --unified --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/ornithe/run_smoke.py --production --audit5 --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          vendor/trs-client/ornithe/gradlew -p vendor/trs-client/ornithe :test --no-daemon --max-workers=2
          python3 tools/ornithe/verify_jar.py "vendor/trs-client/ornithe/build/libs/tflcore-1.8.9-$(sed -n 's/^mod_version=//p' vendor/trs-client/ornithe/gradle.properties).jar"
      - name: Installed 26.3 client, Diorama, loading and native graphics settings
        if: matrix.target == '26.3' && steps.selector.outputs.run != 'false'
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          extra=()
          if [ '${{ matrix.stack }}' != baseline ]; then extra+=("-PdepthRuntimeModsDir=$RUNNER_TEMP/sodium-mods"); fi
          if [ '${{ matrix.stack }}' = iris ]; then
            python3 tools/verification/fetch_shader_pack.py vendor/trs-client/run/prod-26.3/shaderpacks
            extra+=("-Paudit5ShaderPack=ComplementaryReimagined_r5.9.3.zip")
          fi
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=audit5 -PdepthNativeProbe "${extra[@]}" --no-daemon --max-workers=2
          python3 -c 'import json; r=json.load(open("vendor/trs-client/run/prod-26.3/audit5-smoke.json")); assert r["status"]=="passed" and all(c["passed"] for c in r["checks"]); print("Audit5 native checks",len(r["checks"]))'
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=unified -PdepthNativeProbe "${extra[@]}" --no-daemon --max-workers=2
          python3 tools/verification/check_unified.py vendor/trs-client/run/prod-26.3/unified-smoke.json
      - name: Stage verified release without Actions artifact storage
        # An experimental variant never stages release content (nofog is diagnostic only).
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.native_variant != 'nofog' && (matrix.stack == 'argentum' || matrix.stack == 'sodium') && steps.selector.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p verified
          if [ "$TARGET" = '1.8.9' ]; then
            cp -r vendor/trs-client/ornithe/build/smoke/production verified/
            cp vendor/trs-client/ornithe/build/libs/tflcore-1.8.9-$(sed -n 's/^mod_version=//p' vendor/trs-client/ornithe/gradle.properties).jar verified/
            tag=v0.4.0-audit.4-ornithe189
          else
            cp -r vendor/trs-client/run/prod-26.3 verified/
            cp vendor/trs-client/fabric/versions/26.3/build/libs/tflcore-fabric-26.3-0.4.0-audit.4.jar verified/
            tag=v0.4.0-audit.4-fabric263
          fi
          python3 tools/verification/package_unified.py verified release-unified "$TARGET"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" release-unified/* --clobber
          else
            gh release create "$tag" release-unified/* --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "TFL Client $TARGET — Server maps and Diorama camera" --notes-file docs/SERVER_MAPS.md
          fi
      # !cancelled() instead of always(): run 41148081840 skipped the evidence upload on
      # failure while always() was combined with other conditions, destroying the pulse
      # and thread dumps. !cancelled() keeps the failure Influence-free and uploads them.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.retain_artifacts == false) && !(github.event_name == 'workflow_dispatch' && inputs.publish) && steps.selector.outputs.run != 'false' }}
        with:
          name: unified-native-${{ matrix.target }}-${{ matrix.stack }}
          overwrite: true
          path: |
            vendor/trs-client/ornithe/build/smoke/production/probe-pulse.json
            vendor/trs-client/ornithe/build/smoke/production/timeout-threads-*.txt
            vendor/trs-client/ornithe/build/smoke/production/report.json
            vendor/trs-client/ornithe/build/libs/*.jar
            vendor/trs-client/ornithe/build/smoke/
            vendor/trs-client/ornithe/build/test-results/
            vendor/trs-client/ornithe/build/profiles/*-public.jfr
            vendor/trs-client/fabric/versions/26.3/build/profiles/*-public.jfr
            vendor/trs-client/fabric/versions/26.3/build/libs/*.jar
            vendor/trs-client/run/prod-26.3/unified-smoke.json
            vendor/trs-client/run/prod-26.3/screenshots/
  audit5_draft:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_audit5_draft && inputs.native_target == 'all' && inputs.native_stack == 'all' && inputs.native_variant == 'standard' && !inputs.preview_189
    needs: [common, native]
    permissions:
      contents: write
    uses: ./.github/workflows/audit5-candidate.yml
    with:
      acceptance_run: ${{ github.run_id }}

  publish:
    if: ${{ !inputs.preview_189 && inputs.native_variant != 'nofog' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[unified-release]'))) && (github.event_name != 'workflow_dispatch' || (inputs.native_target == 'all' && inputs.native_stack == 'all')) }}
    needs: [common, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: '1.8.9', stack: argentum, tag: v0.4.0-audit.4-ornithe189, title: 'TFL Client 1.8.9 — Server worlds, cardinal camera and Diorama markers'}
          - {target: '26.3', stack: sodium, tag: v0.4.0-audit.4-fabric263, title: 'TFL Client 26.3 — Server worlds, cardinal camera and Diorama markers'}
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

  # Manual preview path, independent of OpenGL/Mesa native smoke timeouts.
  # It does not replace the full certification matrix and NEVER publishes publicly.
  preview_189:
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.preview_189) || (github.event_name == 'push' && github.ref_name == 'fix/server-map-sessions')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Ornithe 1.8.9 without native graphics
        run: |
          vendor/trs-client/ornithe/gradlew -p vendor/trs-client/ornithe :test :remapJar --no-daemon --max-workers=2
      - name: Verify the installable JAR and stage hashes
        run: |
          set -euo pipefail
          jar="vendor/trs-client/ornithe/build/libs/tflcore-1.8.9-$(sed -n 's/^mod_version=//p' vendor/trs-client/ornithe/gradle.properties).jar"
          test -s "$jar"
          python3 tools/ornithe/verify_jar.py "$jar"
          mkdir -p preview-189
          cp "$jar" preview-189/
          cd preview-189
          sha256sum *.jar > SHA256SUMS.txt
          cat > PREVIEW-NOTICE.txt <<'EOF'
          TFL Client 1.8.9 Ornithe Gen2 experimental test JAR.
          Built from the exact branch commit of this draft release.
          JVM unit tests and JAR contract checks passed.
          Native OpenGL/Mesa smoke tests were NOT run by this job.
          This is not a GPU-certified or stable release.
          Use Java 25, OSL 0.22.2 and a backed-up test instance.
          EOF
      - name: Stage preview JAR in draft release (never publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="v0.4.0-audit.4-preview-${short_sha}-ornithe189"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" preview-189/* --clobber
          else
            gh release create "$tag" preview-189/* --draft --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "TFL Client 1.8.9 — Experimental JAR (native checks pending)" \
              --notes "Build-only test candidate for this exact commit. JVM tests and JAR structural checks passed; native GPU smoke tests pending. Not for stable release."
          fi
          echo "Preview draft release: $tag" >> "$GITHUB_STEP_SUMMARY"
