name: Depth and Polish
on:
  push:
    branches: [feat/depth-polish]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified experimental prereleases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: depth-polish-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: vendor/trs-client/gradlew -p vendor/trs-client :common:test -PtrsVersions=26.3 --no-daemon --max-workers=2
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth-common-tests
          path: vendor/trs-client/common/build/test-results/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.8.9'
            stack: baseline
          - target: '1.8.9'
            stack: lwjgl3
          - target: '1.8.9'
            stack: argentum
          - target: '26.3'
            stack: baseline
          - target: '26.3'
            stack: sodium
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxrandr2 libxcursor1 libxi6 libxinerama1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers libopenal1
      - name: Exact 1.8.9 dependencies
        if: matrix.target == '1.8.9'
        run: python3 tools/ornithe/fetch_dependencies.py "$RUNNER_TEMP/ornithe-mods"
      - name: Exact Sodium dependency
        if: matrix.stack == 'sodium'
        run: python3 tools/verification/fetch_optimizers.py "$RUNNER_TEMP/sodium-mods"
      - name: Installed 1.8.9 JAR, isolated probe and native world
        if: matrix.target == '1.8.9'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/ornithe/run_smoke.py --production --large --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/ornithe/run_smoke.py --production --large --restart --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          vendor/trs-client/ornithe/gradlew -p vendor/trs-client/ornithe :test --no-daemon --max-workers=2
          python3 tools/ornithe/verify_jar.py "vendor/trs-client/ornithe/build/libs/tflcore-1.8.9-$(sed -n 's/^mod_version=//p' vendor/trs-client/ornithe/gradle.properties).jar"
      - name: Installed 26.3 JAR and native player/map/lifecycle
        if: matrix.target == '26.3'
        run: |
          extra=()
          if [ '${{ matrix.stack }}' = sodium ]; then extra+=("-PdepthRuntimeModsDir=$RUNNER_TEMP/sodium-mods"); fi
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=depth -PdepthNativeProbe "${extra[@]}" --no-daemon --max-workers=2
          python3 tools/verification/check_native.py vendor/trs-client/run/prod-26.3/depth-smoke.json
      - name: Native 26.3 process restart
        if: matrix.target == '26.3'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=depthrestart -PdepthNativeProbe --no-daemon --max-workers=2
          python3 tools/verification/check_native.py vendor/trs-client/run/prod-26.3/depth-restart.json
      - name: Installed 26.3 JAR, video loop and option navigation
        if: matrix.target == '26.3'
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' vendor/trs-client/gradlew -p vendor/trs-client :fabric:26.3:runProdClient -PtrsVersions=26.3 -PtrsAutotest -PtrsAutotestOnly=screens -PdepthNativeProbe --no-daemon --max-workers=2
          python3 tools/verification/check_native.py vendor/trs-client/run/prod-26.3/screen-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth-native-${{ matrix.target }}-${{ matrix.stack }}
          path: |
            vendor/trs-client/ornithe/build/libs/*.jar
            vendor/trs-client/ornithe/build/smoke/
            vendor/trs-client/ornithe/build/test-results/
            vendor/trs-client/fabric/versions/26.3/build/libs/*.jar
            vendor/trs-client/run/prod-26.3/depth-smoke.json
            vendor/trs-client/run/prod-26.3/depth-restart.json
            vendor/trs-client/run/prod-26.3/screen-smoke.json
            vendor/trs-client/run/prod-26.3/screenshots/
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[depth-release]'))
    needs: [common, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: '1.8.9'
            stack: argentum
            tag: v0.4.0-depth.1-ornithe189
            title: TFL Client 1.8.9 — Depth and Polish preview
          - target: '26.3'
            stack: sodium
            tag: v0.4.0-depth.1-fabric263
            title: TFL Client 26.3 — Depth and Polish preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: depth-native-${{ matrix.target }}-${{ matrix.stack }}
          path: verified
      - name: Assemble verified deliverables
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tools/verification/package_depth.py verified release-depth "$TARGET"
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_TITLE: ${{ matrix.title }}
        run: gh release create "$RELEASE_TAG" release-depth/* --prerelease --latest=false --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file docs/DEPTH_POLISH.md
