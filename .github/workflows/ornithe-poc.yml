name: Ornithe 1.8.9 experiment
on:
  push:
    branches: [feat/ornithe-1.8.9-poc]
  pull_request:
    branches: [adopt/trs-client-foundation]
    paths:
      - 'vendor/trs-client/ornithe/**'
      - 'vendor/trs-client/common/**'
      - 'tools/ornithe/**'
      - 'docs/ornithe/**'
      - '.github/workflows/ornithe-poc.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./vendor/trs-client/ornithe/gradlew -p vendor/trs-client/ornithe build :common:test --no-daemon --max-workers=2
      - run: python3 tools/ornithe/verify_jar.py vendor/trs-client/ornithe/build/libs/tflcore-ornithe-1.8.9-0.4.0-ornithe.1.jar
      - name: Assemble experimental deliverables
        run: |
          mkdir -p release-ornithe
          cp vendor/trs-client/ornithe/build/libs/tflcore-ornithe-1.8.9-0.4.0-ornithe.1.jar release-ornithe/
          cp vendor/trs-client/ornithe/build/libs/*-sources.jar release-ornithe/
          cp tools/ornithe/dependencies.json docs/ornithe/*.md release-ornithe/
          git archive --format=zip --output=release-ornithe/tflclient-ornithe-complete-source.zip HEAD
          cd release-ornithe
          sha256sum *.jar *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tflclient-ornithe-experimental
          path: release-ornithe/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornithe-common-tests
          path: vendor/trs-client/common/build/test-results/test/
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [baseline, lwjgl3, argentum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils libgl1-mesa-dri libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
      - name: Fetch external test dependencies (never uploaded)
        run: python3 tools/ornithe/fetch_dependencies.py "$RUNNER_TEMP/ornithe-mods"
      - name: Real client and process restart
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/ornithe/run_smoke.py --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/ornithe/run_smoke.py --stack '${{ matrix.stack }}' --mods-dir "$RUNNER_TEMP/ornithe-mods" --restart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornithe-runtime-${{ matrix.stack }}
          path: |
            vendor/trs-client/ornithe/build/smoke/
            vendor/trs-client/ornithe/run/logs/
  publish-experiment:
    needs: [build, runtime]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ornithe-poc-release]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tflclient-ornithe-experimental
          path: release-ornithe
      - uses: actions/download-artifact@v4
        with:
          pattern: ornithe-runtime-*
          path: runtime-evidence
      - run: zip -qr release-ornithe/ornithe-runtime-evidence.zip runtime-evidence
      - name: Publish experimental prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.4.0-ornithe.1 release-ornithe/* --prerelease --latest=false --target "$GITHUB_SHA" --title 'TFL Client 1.8.9 — Ornithe Gen2 experiment 1' --notes-file docs/ornithe/RELEASE.md
