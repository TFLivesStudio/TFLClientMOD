plugins {
	id 'java'
}

repositories {
	mavenCentral()
}

def netty = '4.2.16.Final'

dependencies {
	compileOnly "io.netty:netty-transport:${netty}"
	compileOnly "io.netty:netty-buffer:${netty}"
	compileOnly "io.netty:netty-codec-base:${netty}"
	compileOnly "io.netty:netty-handler:${netty}"
	compileOnly "io.netty:netty-codec-classes-quic:${netty}"
}

// Die beiden Schnittstellen kommen zur Laufzeit vom Mod (Eltern-ClassLoader) – nur zum Kompilieren.
sourceSets.main.java {
	srcDir '../common/src/main/java'
	include 'dev/theredstonee/trsclient/e4mcbridge/**'
	include 'dev/theredstonee/trsclient/core/hosting/e4mc/PublicTunnel.java'
	include 'dev/theredstonee/trsclient/core/hosting/net/PeerStream.java'
}

tasks.named('compileJava') {
	options.release = 8
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:-options'
}

jar {
	archiveFileName = 'e4mc-bridge.jar'
	exclude 'dev/theredstonee/trsclient/core/**'
	exclude 'dev/theredstonee/trsclient/e4mcbridge/relay/**'
	from('LICENSE-e4mc') { into 'META-INF' }
	// Reproduzierbar (gleicher Inhalt → gleiche Bytes).
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.register('publishBridge', Copy) {
	from jar
	into '../common/src/main/resources/assets/trsclient/e4mc'
}

// Test native QUIC identity checks against a local certificate, never an insecure trust manager.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "io.netty:netty-codec-classes-quic:${netty}"
    testImplementation "io.netty:netty-handler:${netty}"
    def osName = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
    def nativeOs = osName.contains('win') ? 'windows' : osName.contains('mac') ? 'osx' : 'linux'
    def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
    def nativeArch = arch in ['aarch64','arm64'] ? 'aarch_64' : 'x86_64'
    testRuntimeOnly "io.netty:netty-codec-native-quic:${netty}:${nativeOs}-${nativeArch}"
}
tasks.named('test') { useJUnitPlatform() }

// Standalone infrastructure, never included in the client's isolated bridge JAR.
configurations { relayRuntime }
dependencies {
    relayRuntime "io.netty:netty-codec-classes-quic:${netty}"
    relayRuntime "io.netty:netty-handler:${netty}"
    relayRuntime "io.netty:netty-codec-base:${netty}"
    relayRuntime "io.netty:netty-codec-native-quic:${netty}:linux-x86_64"
}
tasks.register('relayJar', Jar) {
    archiveFileName='tfl-sharing-relay.jar'
    from sourceSets.main.output
    include 'dev/theredstonee/trsclient/e4mcbridge/relay/**'
    manifest { attributes 'Main-Class':'dev.theredstonee.trsclient.e4mcbridge.relay.TflRelay' }
    preserveFileTimestamps=false
    reproducibleFileOrder=true
}
tasks.register('relayDist', Sync) {
    into layout.buildDirectory.dir('relay')
    from(tasks.named('relayJar')) { into 'lib' }
    from(configurations.relayRuntime) { into 'lib' }
}
