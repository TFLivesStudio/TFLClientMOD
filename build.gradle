// The adopted TRS implementation is authoritative. The old src/ tree is retained only as
// migration reference; it is not a source set and can never enter this build's artifacts.
plugins { id 'base' }

def adopted = layout.projectDirectory.dir('vendor/trs-client')
tasks.register('verifyAdoptedFabric', Exec) {
    workingDir adopted
    commandLine 'bash', 'gradlew', '--no-daemon', '--max-workers=2', ':common:test', ':fabric:26.3:build', '-PtrsVersions=26.3'
}
tasks.register('test') { dependsOn 'verifyAdoptedFabric' }
tasks.named('check') { dependsOn 'verifyAdoptedFabric' }
tasks.register('legacyBuild', Exec) {
    workingDir adopted.dir('legacy')
    commandLine 'bash', 'gradlew', '--no-daemon', '--max-workers=2', 'build', '-PtrsVersions=1.8.9'
}
